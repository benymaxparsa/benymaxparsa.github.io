{% comment %}
  Rotating portrait: picks one of nine photos, never repeating the last three
  a visitor saw (same scheme the old sidebar used). The src is set by the inline
  script so the browser fetches exactly one image; width/height reserve the box.
{% endcomment %}
<img class="home-hero__photo" id="home-photo" width="400" height="400" alt="{{ include.alt }}" fetchpriority="high" decoding="async">
<script>
  (function () {
    var img = document.getElementById('home-photo');
    var n = 9, seen = [], pick;
    try { seen = JSON.parse(localStorage.getItem('lastThreeImages')) || []; } catch (e) {}
    do { pick = '/images/Profile_Pictures/sm/p' + (1 + Math.floor(Math.random() * n)) + '.jpg'; }
    while (seen.indexOf(pick) !== -1 && seen.length < n);
    seen.push(pick);
    try { localStorage.setItem('lastThreeImages', JSON.stringify(seen.slice(-3))); } catch (e) {}
    img.src = pick;
  })();
</script>
<noscript><img class="home-hero__photo" src="/images/Profile_Pictures/sm/p1.jpg" width="400" height="400" alt="{{ include.alt }}"></noscript>
