# Course materials shared with students.
#
# Each course may carry an `fr:` block overriding name/role/terms/blurb
# (and optionally `titles:`) for /fr/enseignement/materiel/. The file
# list itself is shared: the PDFs are the same in both languages.
#
# HOW TO ADD MATERIAL:
#   1. Drop the file (PDF, slides, etc.) into the course's `dir` below.
#   2. That's it. The page lists whatever is actually in the folder, so
#      there are never dead links and no YAML edit is required.
#
# The display name is derived from the filename (underscores and dashes
# become spaces). To show something different, add the filename under that
# course's `titles:` mapping, e.g.
#
#   titles:
#     SOEN363_Tutorial_ER_Diagrams_with_drawio.pdf: "ER Diagrams with draw.io"
#
# `topics:` (same filename keys, with an `fr:` copy) is a one-line summary
# of what the file covers, shown under it. Written by reading the file.

courses:
  - code: "COMP 339"
    name: "Combinatorics"
    role: "Tutorial Instructor"
    terms: "Fall 2024, Fall 2025, Fall 2026"
    blurb: "Tutorial notes covering counting, recurrences, generating functions, and graph-theoretic combinatorics."
    dir: "/files/teaching/comp339/"
    titles:
      COMP339_Tutorial_1_Counting.pdf: "Tutorial 1: Counting Principles"
      COMP339_Tutorial_2_Counting_and_Induction.pdf: "Tutorial 2: Counting and Induction"
      Tutorial_3_Shelves_Round_Tables_Card_Hands.pdf: "Tutorial 3: Shelves, Round Tables, and Card Hands"
      Tutorial_4_Positive_Solutions_Induction_Fibonacci.pdf: "Tutorial 4: Positive Solutions, Induction, and Fibonacci Numbers"
      Tutorial_5_Inclusion_Exclusion_Derangements.pdf: "Tutorial 5: Inclusion–Exclusion and Derangements"
      Tutorial_6_Generating_Functions_Partitions_Recurrences.pdf: "Tutorial 6: Generating Functions, Partitions, and Recurrences"
      COMP339_Tutorial_7_Graph_Theory.pdf: "Tutorial 7: Eulerian Trails, Planarity, and Bipartite Graphs"
      COMP339_Tutorial_8_Graph_Theory.pdf: "Tutorial 8: Hamiltonian Paths, Trees, and Graph Orientations"
      Tutorial_9_Graph_Isomorphism_Hypercubes_Longest_Paths.pdf: "Tutorial 9: Graph Isomorphism, Hypercubes, and Longest Paths"
      Tutorial_10_Complements_Duals_Region_Counting_Bipartite.pdf: "Tutorial 10: Complements, Duals, Region Counting, and Bipartite Graphs"
      COMP339_Lecture_Induction_and_Strong_Induction.pdf: "Lecture Notes: Induction and Strong Induction"
      COMP339_Lecture_Graph_Theory_Basics.pdf: "Lecture Notes: Graph Theory Basics"
    topics:
      COMP339_Lecture_Induction_and_Strong_Induction.pdf: "Ordinary and strong induction: how to write the proof, how many base cases you need, and the common mistakes."
      COMP339_Tutorial_1_Counting.pdf: "Rules of sum and product, permutations, combinations, arrangements with repeated objects, complements, the gap method, and combinatorial arguments."
      COMP339_Tutorial_2_Counting_and_Induction.pdf: "Routes on a road map, identical versus labelled containers, “at least” conditions, stars and bars, and proofs by induction (divisibility, inequalities, sums)."
      Tutorial_3_Shelves_Round_Tables_Card_Hands.pdf: "Arrangements on shelves, round-table seatings, card hands, strings with a prescribed composition, the binomial and multinomial theorems, and inequalities with slack variables."
      Tutorial_4_Positive_Solutions_Induction_Fibonacci.pdf: "Positive integer solutions, systems of equations, induction for divide-and-conquer bounds, extending two-object arguments to n objects, and Fibonacci identities."
      Tutorial_5_Inclusion_Exclusion_Derangements.pdf: "Inclusion–exclusion with upper bounds, exactly and at least m conditions, glued letters, derangements, generating functions for distributions, and integer compositions."
      Tutorial_6_Generating_Functions_Partitions_Recurrences.pdf: "Generating functions for weighted equations and partitions, exponential generating functions, recurrence solving, and combinatorial and algebraic proofs."
      Tutorial_9_Graph_Isomorphism_Hypercubes_Longest_Paths.pdf: "Graph isomorphism and invariants, complements, hypercubes and Gray codes, path counting, prescribed degrees, longest-path arguments, and bipartite paths."
      Tutorial_10_Complements_Duals_Region_Counting_Bipartite.pdf: "The edge-budget argument for a graph and its complement, dual graphs, bounds from region degrees, degree-sum extremal problems (bound, then attain), bipartite graphs and odd cycles (Kőnig), hereditary properties, and complements of joins."
      COMP339_Lecture_Graph_Theory_Basics.pdf: "Graph theory basics (Sections 11.1 to 11.3): directed and undirected graphs, trails, paths and cycles, connectivity, subgraphs and complements, graph isomorphism, and vertex degree."
      COMP339_Tutorial_7_Graph_Theory.pdf: "The Handshaking Theorem, complete and regular graphs, Eulerian trails and Euler’s theorem, a lower bound on the edges of a connected graph, bipartite and planar graphs (K5 and K3,3), and forcing a triangle."
      COMP339_Tutorial_8_Graph_Theory.pdf: "Euler’s formula and the edge bounds, subdivisions and Kuratowski’s theorem (the Petersen graph), complements, Hamilton paths and cycles, trees and pendant vertices, orientations, and Rédei’s theorem."
    fr:
      name: "Combinatoire"
      role: "Instructeur de tutoriels"
      terms: "Automne 2024, Automne 2025, Automne 2026"
      blurb: "Notes de tutoriel portant sur le dénombrement, les récurrences, les fonctions génératrices et la combinatoire des graphes."
      titles:
        COMP339_Tutorial_1_Counting.pdf: "Tutoriel 1 : principes du dénombrement"
        COMP339_Tutorial_2_Counting_and_Induction.pdf: "Tutoriel 2 : dénombrement et récurrence"
        Tutorial_3_Shelves_Round_Tables_Card_Hands.pdf: "Tutoriel 3 : étagères, tables rondes et mains de cartes"
        Tutorial_4_Positive_Solutions_Induction_Fibonacci.pdf: "Tutoriel 4 : solutions positives, récurrence et nombres de Fibonacci"
        Tutorial_5_Inclusion_Exclusion_Derangements.pdf: "Tutoriel 5 : inclusion-exclusion et dérangements"
        Tutorial_6_Generating_Functions_Partitions_Recurrences.pdf: "Tutoriel 6 : fonctions génératrices, partitions et récurrences"
        COMP339_Tutorial_7_Graph_Theory.pdf: "Tutoriel 7 : pistes eulériennes, planarité et graphes bipartis"
        COMP339_Tutorial_8_Graph_Theory.pdf: "Tutoriel 8 : chemins hamiltoniens, arbres et orientations de graphes"
        Tutorial_9_Graph_Isomorphism_Hypercubes_Longest_Paths.pdf: "Tutoriel 9 : isomorphisme de graphes, hypercubes et plus longs chemins"
        Tutorial_10_Complements_Duals_Region_Counting_Bipartite.pdf: "Tutoriel 10 : compléments, graphes duaux, dénombrement des régions et graphes bipartis"
        COMP339_Lecture_Induction_and_Strong_Induction.pdf: "Notes de cours : récurrence simple et forte"
        COMP339_Lecture_Graph_Theory_Basics.pdf: "Notes de cours : bases de la théorie des graphes"
      topics:
        COMP339_Lecture_Induction_and_Strong_Induction.pdf: "Récurrence simple et forte : comment rédiger la preuve, combien de cas de base prévoir, et les erreurs courantes."
        COMP339_Tutorial_1_Counting.pdf: "Règles de la somme et du produit, permutations, combinaisons, arrangements avec objets répétés, complémentaire, méthode des espaces et arguments combinatoires."
        COMP339_Tutorial_2_Counting_and_Induction.pdf: "Trajets sur une carte routière, contenants identiques ou étiquetés, conditions « au moins », étoiles et barres, et preuves par récurrence (divisibilité, inégalités, sommes)."
        Tutorial_3_Shelves_Round_Tables_Card_Hands.pdf: "Arrangements sur des étagères, placements à une table ronde, mains de cartes, chaînes de composition fixée, théorèmes binomial et multinomial, et inégalités avec variables d’écart."
        Tutorial_4_Positive_Solutions_Induction_Fibonacci.pdf: "Solutions entières positives, systèmes d’équations, récurrence pour les bornes de type diviser pour régner, extension des arguments à n objets et identités de Fibonacci."
        Tutorial_5_Inclusion_Exclusion_Derangements.pdf: "Inclusion-exclusion avec bornes supérieures, conditions « exactement m » et « au moins m », lettres regroupées, dérangements, fonctions génératrices et compositions d’un entier."
        Tutorial_6_Generating_Functions_Partitions_Recurrences.pdf: "Fonctions génératrices pour équations pondérées et partitions, fonctions génératrices exponentielles, résolution de récurrences et preuves combinatoires et algébriques."
        Tutorial_9_Graph_Isomorphism_Hypercubes_Longest_Paths.pdf: "Isomorphisme et invariants, compléments, hypercubes et codes de Gray, dénombrement de chemins, degrés prescrits, plus longs chemins et chemins dans les graphes bipartis."
        Tutorial_10_Complements_Duals_Region_Counting_Bipartite.pdf: "Argument du budget d’arêtes pour un graphe et son complément, graphes duaux, bornes tirées des degrés des régions, problèmes extrémaux sur la somme des degrés (borner, puis atteindre), graphes bipartis et cycles impairs (Kőnig), propriétés héréditaires et compléments de joints."
        COMP339_Lecture_Graph_Theory_Basics.pdf: "Bases de la théorie des graphes (sections 11.1 à 11.3) : graphes orientés et non orientés, pistes, chemins et cycles, connexité, sous-graphes et compléments, isomorphisme de graphes et degré d’un sommet."
        COMP339_Tutorial_7_Graph_Theory.pdf: "Lemme des poignées de main, graphes complets et réguliers, pistes eulériennes et théorème d’Euler, nombre minimal d’arêtes d’un graphe connexe, graphes bipartis et planaires (K5 et K3,3), et forcer un triangle."
        COMP339_Tutorial_8_Graph_Theory.pdf: "Formule d’Euler et bornes sur les arêtes, subdivisions et théorème de Kuratowski (graphe de Petersen), compléments, chemins et cycles hamiltoniens, arbres et sommets pendants, orientations et théorème de Rédei."

  - code: "SOEN 363"
    name: "Data Systems for Software Engineers"
    role: "Tutorial Instructor, POD, and Marker"
    terms: "Winter 2025, Fall 2025, Winter 2026, Fall 2026"
    blurb: "Tutorial slides on relational design, query languages, indexing, transactions, and NoSQL data systems."
    dir: "/files/teaching/soen363/"
    titles:
      SOEN363_Tutorial_ER_Diagrams_with_drawio.pdf: "Tutorial: ER Diagrams with draw.io"
    topics:
      SOEN363_Tutorial_ER_Diagrams_with_drawio.pdf: "Getting started with draw.io: the interface, the course’s ER notation in draw.io, building and styling a diagram step by step, exporting, common mistakes, and a hands-on exercise."
    fr:
      name: "Systèmes de données pour les ingénieurs en logiciel"
      role: "Instructeur de tutoriels, programmeur de service (POD) et correcteur"
      terms: "Hiver 2025, Automne 2025, Hiver 2026, Automne 2026"
      blurb: "Diapositives de tutoriel sur la conception relationnelle, les langages de requête, l’indexation, les transactions et les systèmes de données NoSQL."
      titles:
        SOEN363_Tutorial_ER_Diagrams_with_drawio.pdf: "Tutoriel : diagrammes entité-association avec draw.io"
      topics:
        SOEN363_Tutorial_ER_Diagrams_with_drawio.pdf: "Prise en main de draw.io : l’interface, la notation EA du cours dans draw.io, construire et mettre en forme un diagramme pas à pas, l’export, les erreurs courantes et un exercice pratique."
